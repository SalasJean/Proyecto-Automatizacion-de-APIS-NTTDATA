# Configuracion del framework Serenity BDD esto es estandar
serenity {
  project.name = "petstore-api-test"
  test.root = "com.nttdata.testing"
  logging = "VERBOSE"
  console.colors = true
}

# Configuracion centralizada de la API Rest tambien de la apy_key aunque esta es opcional segun el contrato de la api de swagger
